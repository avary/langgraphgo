version: "2"
run:
  tests: true
linters:
  enable:
    - gosec
    - misspell
  disable:
    - cyclop
    - depguard
    - err113
    - errorlint
    - exhaustive
    - exhaustruct
    - forcetypeassert
    - funlen
    - gocognit
    - gocyclo
    - godot
    - godox
    - ireturn
    - lll
    - maintidx
    - mnd
    - nlreturn
    - nolintlint
    - revive
    - tagliatelle
    - testpackage
    - unparam
    - varnamelen
    - whitespace
    - wrapcheck
    - wsl
  settings:
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
    gosec:
      excludes:
        - G404
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      - linters:
          - gosec
          - lll
          - unused
        path: .*\.pb\.go
      - linters:
          - gosec
          - unused
        path: vendor/
    paths:
      - third_party$
      - builtin$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
